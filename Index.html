<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Bitácora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f14'/><rect x='20' y='44' width='60' height='12' fill='%23ff8a3d'/></svg>">
<style>
  :root{
    --ink:#0d0f14; --panel:#161a22; --panel-2:#1d222c; --line:#2a3140;
    --text:#e8eaf0; --dim:#8790a3; --signal:#ff8a3d; --steel:#5aa9e6;
    --good:#4ade80; --violet:#a78bfa; --pad:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;padding-bottom:84px;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  header{position:sticky;top:0;z-index:20;background:rgba(13,15,20,.94);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:14px var(--pad) 0}
  .brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand h1{margin:0;font-size:19px;letter-spacing:.07em;font-weight:800;text-transform:uppercase}
  .brand h1 span{color:var(--signal)}
  .wk{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
  .wk b{color:var(--text)}
  nav{display:flex;gap:4px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;background:none;border:0;color:var(--dim);font:inherit;
    font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent}
  nav button.on{color:var(--text);border-bottom-color:var(--signal)}
  nav button.rest{color:#5c6478;font-weight:500}
  main{padding:var(--pad)}

  .phase{border-radius:12px;padding:13px 14px;margin-bottom:12px;border:1px solid}
  .phase .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .phase .ttl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
  .phase .pill{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;
    font-weight:700;letter-spacing:.05em;background:rgba(255,255,255,.07)}
  .phase p{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
  .phase .tech{margin-top:8px;font-size:12px;padding:7px 9px;border-radius:7px;
    background:rgba(0,0,0,.25);color:var(--text);font-weight:600}
  .p-intro{background:rgba(90,169,230,.08);border-color:rgba(90,169,230,.3)}
  .p-intro .ttl{color:var(--steel)}
  .p-accum{background:rgba(255,138,61,.08);border-color:rgba(255,138,61,.3)}
  .p-accum .ttl{color:var(--signal)}
  .p-intens{background:rgba(167,139,250,.09);border-color:rgba(167,139,250,.32)}
  .p-intens .ttl{color:var(--violet)}
  .p-deload{background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.28)}
  .p-deload .ttl{color:var(--good)}

  .bar{height:5px;border-radius:4px;background:#1d222c;display:flex;gap:2px;margin-top:11px;overflow:hidden}
  .bar i{flex:1;background:#2a3140;border-radius:2px}
  .bar i.done{background:#3f4a5e}
  .bar i.now{background:var(--signal)}
  .bar i.dl{background:var(--good);opacity:.45}

  .block{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    margin-bottom:12px;overflow:hidden}
  .block > h3{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--dim);font-weight:700;border-bottom:1px solid var(--line);
    background:var(--panel-2);display:flex;align-items:center;gap:8px}
  .tag{font-size:10px;letter-spacing:.05em;padding:2px 7px;border-radius:20px;font-weight:700}
  .block > h3 .tag{margin-left:auto}
  .t-mov{background:rgba(90,169,230,.14);color:var(--steel)}
  .t-pow{background:rgba(255,138,61,.14);color:var(--signal)}
  .t-fin{background:rgba(74,222,128,.12);color:var(--good)}
  .t-fore{background:rgba(167,139,250,.14);color:var(--violet)}
  .block ul{margin:0;padding:12px 14px;list-style:none;color:var(--dim);font-size:14px}
  .block ul li{padding:2px 0}
  .block ul li::before{content:"·";color:var(--signal);margin-right:8px}

  .ex{border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:0}
  .ex-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
  .ex-name{flex:1;min-width:0}
  .ex-name .n{font-weight:650;font-size:14.5px;line-height:1.28}
  .ex-name .m{font-size:11.5px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
  .chev{color:#4a5265;font-size:11px;transition:transform .18s}
  .ex.open .chev{transform:rotate(90deg)}
  .cue{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#333a49}
  .cue.done{background:var(--good)}
  .cue.up{background:var(--signal);box-shadow:0 0 0 3px rgba(255,138,61,.16)}
  .ex-body{display:none;padding:0 14px 14px}
  .ex.open .ex-body{display:block}

  .setrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .setrow .lbl{width:26px;flex:0 0 26px;font-size:11px;color:#5c6478;font-weight:700;text-align:center}
  .setrow .lbl.last{color:var(--signal)}
  .setrow input{flex:1;min-width:0;background:#10131a;border:1px solid var(--line);
    color:var(--text);border-radius:8px;padding:10px 8px;font:inherit;font-size:15px;
    text-align:center;font-variant-numeric:tabular-nums}
  .setrow input:focus{outline:none;border-color:var(--steel)}
  .setrow input::placeholder{color:#3d4453}
  .setrow .x{color:#4a5265;font-size:12px;flex:0 0 auto}
  .prev{font-size:11.5px;color:#5c6478;margin:2px 0 10px 34px}
  .prev b{color:var(--steel);font-weight:600}
  .hint{font-size:12px;padding:8px 10px;border-radius:8px;margin-top:2px;
    background:rgba(255,138,61,.09);color:var(--signal);border:1px solid rgba(255,138,61,.22)}
  .hint.ok{background:rgba(74,222,128,.08);color:var(--good);border-color:rgba(74,222,128,.2)}
  .exbtns{display:flex;gap:8px;margin-top:10px}
  .exbtns button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12px;font-weight:650;padding:9px;border-radius:8px;cursor:pointer}
  .exbtns button:active{background:#252b36}
  canvas{width:100%;height:110px;display:block;margin-top:12px;border-radius:8px;background:#10131a}

  .save{position:fixed;left:0;right:0;bottom:0;z-index:30;
    padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--ink) 62%,rgba(13,15,20,0))}
  .save button{width:100%;background:var(--signal);color:#160c04;border:0;border-radius:11px;
    padding:15px;font:inherit;font-weight:800;font-size:14px;letter-spacing:.1em;
    text-transform:uppercase;cursor:pointer}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center}
  .stat .v{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .stat .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
  .tools{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .tools button{flex:1;min-width:120px;background:none;border:1px solid var(--line);color:var(--dim);
    font:inherit;font-size:12px;padding:11px;border-radius:9px;cursor:pointer}
  .warnbox{margin-top:14px;font-size:12px;color:#6b7488;line-height:1.55;
    border-left:2px solid var(--line);padding-left:12px}
  .warnbox b{color:#98a1b3}
  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--good);color:#07220f;padding:11px 20px;border-radius:30px;
    font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Bitá<span>cora</span></h1>
    <div class="wk">Bloque <b id="blk" class="num">A</b> · Semana <b id="wknum" class="num">1</b>/9<br><span id="today"></span></div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="save" id="savebar"><button id="savebtn">Guardar sesión</button></div>
<div class="toast" id="toast"></div>
<script>
/* Programa con 2 variantes por ejercicio (bloque A / bloque B) */
const PROGRAM = {
  lun: {
    name:"Upper", sub:"Fuerza",
    warm:["Cardio ligero — 5 min","Dislocaciones con banda — 15 reps","Gato-vaca torácico — 10 reps","Rotación externa con banda — 15/lado","Círculos de brazo — 10/lado"],
    ex:[
      {sets:3, lo:5, hi:7, rest:"3-4 min", v:[
        {id:"inc_bb", n:"Press inclinado con barra 45°", note:"Pausa 1s abajo manteniendo tensión en el pecho."},
        {id:"inc_db", n:"Press inclinado con mancuernas 45°", note:"Más rango que la barra. Baja hasta sentir el estiramiento."}]},
      {sets:4, lo:3, hi:5, rest:"90s", tag:"pow", v:[
        {id:"push_exp", n:"Flexiones explosivas", note:"Manos despegan del piso. Corporal — peso en 0."},
        {id:"push_clap", n:"Flexiones con palmada", note:"Progresión de la anterior. Corporal — peso en 0."}]},
      {sets:3, lo:8, hi:12, rest:"90s", v:[
        {id:"cross_ladder", n:"Cable crossover en escalera", note:"Una serie polea baja, una media, una alta."},
        {id:"pec_deck_A", n:"Pec deck", note:"Estiramiento profundo, pausa 1s en la contracción."}]},
      {sets:3, lo:5, hi:8, rest:"2-3 min", v:[
        {id:"pullup_w", n:"Dominadas agarre ancho (lastradas)", note:"Negativa 2-3s. Peso = lastre; 0 si es corporal."},
        {id:"pulldown_w", n:"Jalón agarre ancho", note:"Codos abajo y atrás. Pecho arriba."}]},
      {sets:3, lo:6, hi:8, rest:"2-3 min", v:[
        {id:"ohp", n:"Press militar con barra", note:"Glúteo y abdomen apretados, sin arquear."},
        {id:"ohp_smith", n:"Press de hombro en Smith", note:"Codos rompen los 90°."}]},
      {sets:3, lo:6, hi:8, rest:"2-3 min", v:[
        {id:"row_pend", n:"Remo Pendlay con déficit", note:"Parado sobre disco. Estirón grande abajo, barra al abdomen."},
        {id:"row_smith", n:"Remo en Smith", note:"Torso a 45°, aprieta escápulas arriba."}]},
      {sets:2, lo:8, hi:12, rest:"90s", v:[
        {id:"tri_oh_bar", n:"Extensión tríceps overhead en polea (barra)", note:"Pausa 0.5-1s en el estiramiento."},
        {id:"tri_oh_rope", n:"Extensión tríceps overhead en polea (cuerda)", note:"Abre la cuerda en la contracción."}]},
      {sets:2, lo:8, hi:12, rest:"90s", v:[
        {id:"curl_bay", n:"Curl bayesiano en polea", note:"Polea baja detrás de ti, tensión constante."},
        {id:"curl_inc", n:"Curl inclinado con mancuernas", note:"Brazos colgando atrás, máximo estiramiento."}]},
    ],
    fin:["Farmer's walk — 3 × 40 m pesado (agarre + core)","Descanso 60-90s entre rondas"]
  },

  mar: {
    name:"Lower", sub:"Fuerza",
    warm:["Bici o caminadora — 5 min","Sentadilla profunda con pausa — 5 × 20s","Movilidad de cadera 90/90 — 8/lado","Movilidad de tobillo en pared — 10/lado","Puente de glúteo — 15 reps"],
    ex:[
      {sets:2, lo:8, hi:12, rest:"90s", v:[
        {id:"curl_lying", n:"Curl femoral tumbado", note:"Máximo estiramiento abajo. No dejes que suba la cadera."},
        {id:"curl_nordic", n:"Curl femoral sentado", note:"Inclínate al frente para estirar más."}]},
      {sets:3, lo:5, hi:7, rest:"3-4 min", v:[
        {id:"squat_bb", n:"Sentadilla trasera", note:"Profundidad completa sin redondear lumbar."},
        {id:"squat_smith", n:"Sentadilla en Smith", note:"Pies 10cm adelante, torso más vertical, más cuádriceps."}]},
      {sets:4, lo:3, hi:3, rest:"90s", tag:"pow", v:[
        {id:"jump_v", n:"Salto vertical máximo", note:"Aterrizaje suave. Corporal — peso en 0."},
        {id:"jump_broad", n:"Salto horizontal", note:"Aterriza absorbiendo con cadera. Corporal — peso en 0."}]},
      {sets:3, lo:6, hi:8, rest:"2-3 min", v:[
        {id:"rdl_bb", n:"Peso muerto rumano con barra", note:"Para al 75% del bloqueo, tensión en isquios."},
        {id:"rdl_snatch", n:"RDL agarre ancho (snatch)", note:"Más rango. Espalda recta siempre."}]},
      {sets:3, lo:10, hi:15, rest:"90s", v:[
        {id:"leg_ext", n:"Extensión de cuádriceps", note:"Espaldar bien atrás. Negativa de 2-3s."},
        {id:"sissy", n:"Sentadilla sissy (o Nórdico inverso)", note:"Rodillas al frente, cadera bloqueada."}]},
      {sets:3, lo:8, hi:12, rest:"90s", v:[
        {id:"calf_st", n:"Elevación de talones de pie", note:"Pausa 1-2s abajo, estiramiento completo."},
        {id:"calf_press", n:"Elevación de talones en prensa", note:"Rango completo, sin rebote."}]},
      {sets:2, lo:10, hi:15, rest:"90s", v:[
        {id:"cable_crunch", n:"Crunch en polea", note:"Redondea la lumbar al bajar."},
        {id:"crunch_mach", n:"Crunch en máquina", note:"Conexión mente-músculo con el abdomen."}]},
    ],
    fin:["Pallof press con banda — 3 × 10/lado","Plancha lateral — 3 × 30s/lado"]
  },

  mie: { rest:true, name:"Descanso", sub:"Recuperación",
    tips:["Caminata suave 20-30 min si quieres.","Estiramiento o movilidad ligera.","Come y duerme. Aquí es donde crece el músculo."] },

  jue: {
    name:"Pull", sub:"Hipertrofia + Antebrazo",
    warm:["Cardio ligero — 5 min","Colgado pasivo en barra — 2 × 30s","Activación escapular colgado — 10 reps","Rotación externa con banda — 15/lado"],
    ex:[
      {sets:3, lo:8, hi:12, rest:"2-3 min", v:[
        {id:"pulldown_n", n:"Jalón al pecho agarre neutro", note:"Manija más al frente: cruce entre pullover y jalón."},
        {id:"pullup_n", n:"Dominadas agarre neutro", note:"Negativa controlada. Peso = lastre."}]},
      {sets:4, lo:3, hi:5, rest:"90s", tag:"pow", v:[
        {id:"pullup_exp", n:"Dominadas explosivas", note:"Tira lo más rápido posible. Peso en 0 si es corporal."},
        {id:"pulldown_exp", n:"Jalón explosivo", note:"Tirón rápido, negativa lenta."}]},
      {sets:3, lo:8, hi:12, rest:"2-3 min", v:[
        {id:"row_chest", n:"Remo en máquina con apoyo de pecho", note:"Codos a 45°, aprieta escápulas arriba."},
        {id:"row_tbar", n:"Remo T-bar con apoyo de pecho", note:"Rango completo, sin usar impulso."}]},
      {sets:3, lo:10, hi:15, rest:"2 min", v:[
        {id:"row_cable", n:"Remo en polea sentado agarre neutro", note:"Codos abajo y atrás, junta escápulas."},
        {id:"row_db_1", n:"Remo con mancuerna a un brazo", note:"Reps por lado. Estiramiento completo abajo."}]},
      {sets:3, lo:12, hi:15, rest:"90s", v:[
        {id:"rear_cable", n:"Vuelo posterior en polea a un brazo (45°)", note:"Pausa 1-2s en la contracción."},
        {id:"rear_pec", n:"Pec deck invertido", note:"Aprieta duro el deltoide posterior."}]},
      {sets:2, lo:12, hi:15, rest:"90s", v:[
        {id:"shrug", n:"Encogimientos en máquina", note:"Hombros hacia las orejas, pausa arriba."},
        {id:"shrug_db", n:"Encogimientos con mancuernas", note:"Pausa 1s arriba, bajada lenta."}]},
      {sets:3, lo:8, hi:12, rest:"90s", v:[
        {id:"curl_ez", n:"Curl con barra EZ", note:"Sin balanceo. Bajada controlada."},
        {id:"curl_preach", n:"Curl predicador en máquina", note:"Reps suaves y controladas."}]},
      {sets:2, lo:12, hi:15, rest:"60s", tag:"fore", v:[
        {id:"curl_rev", n:"Curl inverso con barra EZ", note:"ANTEBRAZO. Agarre prono. Trabaja braquiorradial y extensores."},
        {id:"curl_ham", n:"Curl martillo con mancuernas", note:"ANTEBRAZO. Agarre neutro, sin balanceo."}]},
      {sets:3, lo:15, hi:20, rest:"60s", tag:"fore", v:[
        {id:"wrist_curl", n:"Curl de muñeca con barra", note:"ANTEBRAZO. Antebrazos apoyados en el banco, solo mueve la muñeca. Rango completo."},
        {id:"wrist_cable", n:"Curl de muñeca en polea", note:"ANTEBRAZO. Tensión constante. Rango completo."}]},
    ],
    fin:["Parada de manos contra pared — 4 × 20-40s","Colgado activo en barra — 3 × máximo tiempo (agarre)"]
  },

  vie: {
    name:"Push", sub:"Hipertrofia",
    warm:["Cardio ligero — 5 min","Dislocaciones con banda — 15 reps","Movilidad torácica en pared — 10 reps","Rotación externa con banda — 15/lado"],
    ex:[
      {sets:3, lo:8, hi:12, rest:"2-3 min", v:[
        {id:"bench_bb", n:"Press de banca con barra", note:"Pausa breve en el pecho, sube explosivo."},
        {id:"bench_mach", n:"Press de pecho en máquina", note:"Rango completo, aprieta el pecho arriba."}]},
      {sets:4, lo:4, hi:6, rest:"90s", tag:"pow", v:[
        {id:"push_exp2", n:"Flexiones explosivas", note:"Corporal — peso en 0."},
        {id:"bench_speed", n:"Press de banca velocidad (50% del 1RM)", note:"Barra rápida. Registra el peso."}]},
      {sets:3, lo:10, hi:12, rest:"2 min", v:[
        {id:"ohp_mach", n:"Press de hombro en máquina", note:"Codos rompen los 90°."},
        {id:"ohp_cable", n:"Press de hombro en polea", note:"Tensión constante, reps controladas."}]},
      {sets:3, lo:12, hi:15, rest:"90s", v:[
        {id:"fly_db_half", n:"Aperturas con mancuerna (mitad baja del rango)", note:"Todo el trabajo en la mitad baja. Estiramiento profundo."},
        {id:"fly_cable", n:"Apertura en polea de baja a alta", note:"Cruza las manos en la contracción."}]},
      {sets:3, lo:12, hi:20, rest:"60s", v:[
        {id:"lat_cable", n:"Elevación lateral en polea alta", note:"Deja el ego afuera. Aprieta el deltoide lateral."},
        {id:"lat_db_lean", n:"Elevación lateral inclinado con mancuerna", note:"Agárrate de un poste e inclínate. Más rango."}]},
      {sets:3, lo:10, hi:15, rest:"90s", v:[
        {id:"tri_oh2", n:"Extensión tríceps overhead en polea", note:"Pausa 0.5-1s en el estiramiento."},
        {id:"tri_skull", n:"Press francés con mancuernas", note:"Codos fijos, estiramiento completo."}]},
      {sets:2, lo:12, hi:15, rest:"60s", v:[
        {id:"tri_kick", n:"Patada de tríceps en polea", note:"Hombro atrás del torso en la contracción."},
        {id:"tri_dip", n:"Fondos entre bancos", note:"Baja hasta 90° en el codo."}]},
      {sets:3, lo:10, hi:20, rest:"90s", v:[
        {id:"leg_raise", n:"Elevación de piernas en silla romana", note:"Redondea la lumbar al subir. Corporal — peso en 0."},
        {id:"leg_hang", n:"Elevación de piernas colgado", note:"Sin balanceo. Corporal — peso en 0."}]},
    ],
    fin:["Zona 2: 18 min (bici, caminadora inclinada o elíptica)","Ritmo: puedes hablar en frases cortas, no cómodo del todo"]
  },

  sab: {
    name:"Legs", sub:"Hipertrofia",
    warm:["Bici — 5 min","Sentadilla profunda con pausa — 5 × 20s","Movilidad 90/90 — 8/lado","Movilidad de tobillo — 10/lado"],
    ex:[
      {sets:3, lo:10, hi:15, rest:"2-3 min", v:[
        {id:"leg_press", n:"Prensa de piernas", note:"Pies abajo en la plataforma para más cuádriceps."},
        {id:"hack_squat", n:"Sentadilla hack", note:"Profundidad completa, control en la bajada."}]},
      {sets:3, lo:10, hi:15, rest:"90s", v:[
        {id:"curl_seat", n:"Curl femoral sentado", note:"Inclínate al frente para estirar más el isquio."},
        {id:"curl_lying2", n:"Curl femoral tumbado", note:"Cadera pegada al banco."}]},
      {sets:3, lo:8, hi:12, rest:"2 min", v:[
        {id:"bulgarian", n:"Sentadilla búlgara con mancuernas", note:"Reps por pierna. Muslo delantero paralelo al piso."},
        {id:"step_up", n:"Step-up con mancuernas", note:"Reps por pierna. Empuja con el talón, no con impulso."}]},
      {sets:3, lo:12, hi:15, rest:"90s", v:[
        {id:"leg_ext2", n:"Extensión de cuádriceps", note:"Negativa de 2-3s."},
        {id:"leg_ext_1", n:"Extensión de cuádriceps a una pierna", note:"Corrige desbalances. Empieza por la pierna débil."}]},
      {sets:2, lo:15, hi:20, rest:"60s", v:[
        {id:"adduct", n:"Aductor en máquina", note:"Conexión con la cara interna del muslo."},
        {id:"adduct_cable", n:"Aducción de cadera en polea", note:"Rango completo, controlado."}]},
      {sets:2, lo:15, hi:20, rest:"60s", v:[
        {id:"abduct", n:"Abductor en máquina", note:"Inclínate al frente y agárrate de los rieles."},
        {id:"abduct_cable", n:"Abducción de cadera en polea", note:"Aprieta el glúteo arriba."}]},
      {sets:3, lo:12, hi:15, rest:"90s", v:[
        {id:"calf2", n:"Elevación de talones de pie", note:"Rango completo, pausa abajo."},
        {id:"calf_seat", n:"Elevación de talones sentado", note:"Enfoca el sóleo. Rango completo."}]},
    ],
    fin:["Zona 2: 20 min en bici o remo (bajo impacto, las piernas ya están fritas)"]
  },

  dom: { rest:true, name:"Descanso", sub:"Recuperación",
    tips:["Caminata larga si te provoca.","Movilidad suave, nada de cargar.","Prepara la comida de la semana."] },
};

/* Ciclo de 9 semanas: reintroducción → acumulación → intensificación → descarga */
const CYCLE = [
  {n:1, phase:"Reintroducción", rpe:"6-7", setMod:-1, failure:false, tech:null,
   note:"Vuelves al gym. Deja 3-4 reps en el tanque en TODAS las series. Se siente fácil a propósito — estás buscando los pesos y despertando el tejido conectivo. No fuerces."},
  {n:2, phase:"Reintroducción", rpe:"7", setMod:0, failure:false, tech:null,
   note:"Series completas, pero todavía sin fallo. Deja 2-3 reps en el tanque. Sube un poco los pesos de la semana pasada."},
  {n:3, phase:"Acumulación", rpe:"7-8", setMod:0, failure:true, tech:null,
   note:"Arranca de verdad. Última serie de cada ejercicio al fallo. Las series previas: deja 1-2 reps."},
  {n:4, phase:"Acumulación", rpe:"8-9", setMod:0, failure:true, tech:null,
   note:"Última serie al fallo. Empuja los pesos donde la app te lo marque en naranja."},
  {n:5, phase:"Acumulación", rpe:"8-9", setMod:1, failure:true, tech:null,
   note:"Serie extra en cada ejercicio. Más volumen = más estímulo, pero también más fatiga. Cuida el sueño."},
  {n:6, phase:"Intensificación", rpe:"9-10", setMod:1, failure:true, tech:"Myo-reps en el último ejercicio de cada grupo",
   note:"Myo-reps: llega al fallo, descansa 15s, saca 3-5 reps más, repite 3 veces."},
  {n:7, phase:"Intensificación", rpe:"9-10", setMod:1, failure:true, tech:"Serie extendida (rest-pause) en los aislamientos",
   note:"Rest-pause: fallo, 20s de descanso, exprime las reps que salgan, repite una vez."},
  {n:8, phase:"Pico", rpe:"10", setMod:1, failure:true, tech:"Myo-reps + parciales al final de la última serie",
   note:"Semana más dura del bloque. Después viene la descarga — aguanta."},
  {n:9, phase:"Descarga", rpe:"5-6", setMod:-2, failure:false, tech:null,
   note:"DESCARGA. Mitad del volumen, pesos al ~60%. Nada de fallo. Esta semana no es opcional: es donde tu cuerpo consolida todo lo del bloque. Sáltatela y te estancas."},
];

const DAYS = ["lun","mar","mie","jue","vie","sab","dom"];
const LABEL = {lun:"Lun",mar:"Mar",mie:"Mié",jue:"Jue",vie:"Vie",sab:"Sáb",dom:"Dom"};
const PHASE_CLASS = {"Reintroducción":"p-intro","Acumulación":"p-accum","Intensificación":"p-intens","Pico":"p-intens","Descarga":"p-deload"};

/* ---------- ALMACENAMIENTO LOCAL (en tu celular) ---------- */
const KEY = "bitacora_v2";
let DB = {log:{}, start:null};
let memoryOnly = false;

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) DB = JSON.parse(raw);
    localStorage.setItem("__t","1"); localStorage.removeItem("__t");
  }catch(e){ memoryOnly = true; }
  if(!DB.start){ DB.start = todayISO(); persist(); }
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ memoryOnly = true; }
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
}
/* Semana absoluta desde que arrancó el programa */
function absWeek(){
  const ms = new Date(todayISO()) - new Date(DB.start);
  return Math.max(1, Math.floor(ms/(7*864e5)) + 1);
}
/* Semana dentro del ciclo de 9, y bloque (A/B alternando) */
function cycleWeek(){ return ((absWeek()-1) % CYCLE.length) + 1; }
function blockIdx(){ return Math.floor((absWeek()-1) / CYCLE.length) % 2; }
function blockName(){ return blockIdx()===0 ? "A" : "B"; }
function phase(){ return CYCLE[cycleWeek()-1]; }

/* Ejercicio efectivo de esta semana: variante del bloque + series ajustadas por fase */
function resolve(ex){
  const v = ex.v[blockIdx() % ex.v.length];
  const sets = Math.max(1, ex.sets + phase().setMod);
  return {...v, sets, lo:ex.lo, hi:ex.hi, rest:ex.rest, tag:ex.tag};
}
function history(exId){
  const out=[];
  Object.keys(DB.log).sort().forEach(d=>{
    const e = DB.log[d][exId];
    if(e && e.sets && e.sets.some(s=>s.r)) out.push({date:d, sets:e.sets});
  });
  return out;
}
function findEx(id){
  for(const d of DAYS){
    const p = PROGRAM[d];
    if(!p.ex) continue;
    for(const ex of p.ex){ if(ex.v.some(x=>x.id===id)) return ex; }
  }
  return null;
}

let day = DAYS[(new Date().getDay()+6)%7];
let draft = {};
const main = document.getElementById("main");
const nav  = document.getElementById("nav");
const savebar = document.getElementById("savebar");

function renderNav(){
  nav.innerHTML = DAYS.map(d=>{
    const p = PROGRAM[d];
    return `<button data-d="${d}" class="${d===day?"on":""} ${p.rest?"rest":""}">${LABEL[d]}</button>`;
  }).join("");
  nav.querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{ day=b.dataset.d; draft={}; renderNav(); render(); window.scrollTo(0,0); };
  });
}

function phaseHTML(){
  const ph = phase(), cw = cycleWeek();
  let bar = "";
  CYCLE.forEach(c=>{
    const cls = c.n===cw ? "now" : c.phase==="Descarga" ? "dl" : c.n<cw ? "done" : "";
    bar += `<i class="${cls}"></i>`;
  });
  return `
  <div class="phase ${PHASE_CLASS[ph.phase]}">
    <div class="top">
      <div class="ttl">${ph.phase}</div>
      <div class="pill">RPE ${ph.rpe} · ${ph.failure ? "última serie al fallo" : "sin fallo"}</div>
    </div>
    <p>${ph.note}</p>
    ${ph.tech ? `<div class="tech">Técnica: ${ph.tech}</div>` : ""}
    <div class="bar">${bar}</div>
  </div>`;
}

function render(){
  const p = PROGRAM[day];
  document.getElementById("wknum").textContent = cycleWeek();
  document.getElementById("blk").textContent = blockName();
  document.getElementById("today").textContent = p.name + (p.sub ? " · "+p.sub : "");

  if(p.rest){
    savebar.style.display = "none";
    main.innerHTML = phaseHTML() + `
      <div class="block"><h3>Descanso</h3>
        <ul>${p.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>` + toolsHTML();
    bindTools();
    return;
  }
  savebar.style.display = "block";

  const dayLog = DB.log[todayISO()] || {};
  const list = p.ex.map(resolve);

  main.innerHTML = phaseHTML() + `
    <div class="stats">
      <div class="stat"><div class="v num">${list.length}</div><div class="k">Ejercicios</div></div>
      <div class="stat"><div class="v num">${list.reduce((a,e)=>a+e.sets,0)}</div><div class="k">Series</div></div>
      <div class="stat"><div class="v num">${Object.keys(DB.log).length}</div><div class="k">Sesiones</div></div>
    </div>
    <div class="block"><h3>Movilidad <span class="tag t-mov">antes</span></h3>
      <ul>${p.warm.map(w=>`<li>${w}</li>`).join("")}</ul></div>
    <div class="block" id="exblock"></div>
    <div class="block"><h3>Finisher <span class="tag t-fin">al cierre</span></h3>
      <ul>${p.fin.map(f=>`<li>${f}</li>`).join("")}</ul></div>
    ` + toolsHTML();

  const eb = document.getElementById("exblock");
  eb.innerHTML = list.map(ex=>exHTML(ex, dayLog[ex.id])).join("");

  eb.querySelectorAll(".ex-head").forEach(h=>{
    h.onclick = ()=>{
      const ex = h.parentElement;
      ex.classList.toggle("open");
      if(ex.classList.contains("open")) drawChart(ex.dataset.id);
    };
  });
  eb.querySelectorAll("input").forEach(i=>{
    i.oninput = ()=>{
      const {id,idx,f} = i.dataset;
      draft[id] = draft[id] || {sets:[]};
      draft[id].sets[idx] = draft[id].sets[idx] || {};
      draft[id].sets[idx][f] = i.value;
      updateCue(id);
    };
  });
  eb.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick = ()=>{
      const id = b.dataset.copy, h = history(id);
      if(!h.length){ toast("Sin sesiones previas"); return; }
      const last = h[h.length-1].sets;
      document.querySelectorAll(`input[data-id="${id}"]`).forEach(inp=>{
        const s = last[inp.dataset.idx];
        if(s && s[inp.dataset.f]!=null){
          inp.value = s[inp.dataset.f];
          inp.dispatchEvent(new Event("input"));
        }
      });
      toast("Copiado de la última vez");
    };
  });
  bindTools();
  list.forEach(e=>updateCue(e.id));
}

function exHTML(ex, saved){
  const h = history(ex.id);
  const last = h.length ? h[h.length-1] : null;
  const prevTxt = last
    ? `Última (${fmt(last.date)}): <b>${last.sets.filter(s=>s&&s.r).map(s=>`${s.w||0}kg × ${s.r}`).join(" · ")}</b>`
    : `Primera vez con este ejercicio — esta sesión marca la base.`;

  let rows = "";
  for(let i=0;i<ex.sets;i++){
    const s = (saved && saved.sets[i]) || {};
    const isLast = i === ex.sets-1;
    rows += `<div class="setrow">
        <div class="lbl ${isLast && phase().failure ? "last":""}">${i+1}</div>
        <input type="number" inputmode="decimal" step="0.5" placeholder="kg"
               data-id="${ex.id}" data-idx="${i}" data-f="w" value="${s.w??""}">
        <div class="x">×</div>
        <input type="number" inputmode="numeric" placeholder="reps"
               data-id="${ex.id}" data-idx="${i}" data-f="r" value="${s.r??""}">
      </div>`;
  }
  const range = ex.lo===ex.hi ? `${ex.lo}` : `${ex.lo}-${ex.hi}`;
  let tags = "";
  if(ex.tag==="pow")  tags = ` <span class="tag t-pow">potencia</span>`;
  if(ex.tag==="fore") tags = ` <span class="tag t-fore">antebrazo</span>`;

  return `<div class="ex" data-id="${ex.id}">
      <div class="ex-head">
        <div class="cue" id="cue-${ex.id}"></div>
        <div class="ex-name">
          <div class="n">${ex.n}${tags}</div>
          <div class="m num">${ex.sets} × ${range} reps · descanso ${ex.rest}</div>
        </div>
        <div class="chev">▶</div>
      </div>
      <div class="ex-body">
        <div class="prev">${prevTxt}</div>
        ${rows}
        <div id="hint-${ex.id}"></div>
        <div class="exbtns"><button data-copy="${ex.id}">Repetir última</button></div>
        <canvas id="ch-${ex.id}" height="110"></canvas>
        <div class="prev" style="margin:8px 0 0 0">${ex.note}</div>
      </div>
    </div>`;
}

/* Doble progresión — solo sugiere subir peso en semanas de trabajo real */
function updateCue(id){
  const raw = findEx(id); if(!raw) return;
  const ex = resolve(raw);
  const cue = document.getElementById("cue-"+id);
  const hint = document.getElementById("hint-"+id);
  if(!cue) return;
  const d = draft[id] || (DB.log[todayISO()]||{})[id];

  cue.className = "cue";
  if(hint) hint.innerHTML = "";
  if(!d || !d.sets) return;

  const filled = d.sets.slice(0,ex.sets).filter(s=>s&&s.r).length;
  if(filled === 0) return;

  if(filled >= ex.sets){
    const ph = phase();
    if(ph.phase === "Descarga"){
      cue.className = "cue done";
      if(hint) hint.innerHTML = `<div class="hint ok">Descarga: no subas peso. Solo completa y vete a casa.</div>`;
      return;
    }
    const allTop = d.sets.slice(0,ex.sets).every(s => s && Number(s.r) >= ex.hi);
    if(allTop && ex.hi > ex.lo){
      cue.className = "cue up";
      const w = Math.max(...d.sets.slice(0,ex.sets).map(s => Number(s&&s.w) || 0));
      const bump = w>=60 ? 5 : w>=20 ? 2.5 : w>0 ? 1 : 0;
      if(hint) hint.innerHTML = bump
        ? `<div class="hint">Llenaste el rango en todas las series. La próxima sube a <b>${(w+bump).toFixed(1).replace(".0","")} kg</b> y vuelve a ${ex.lo} reps.</div>`
        : `<div class="hint">Llenaste el rango en corporal. Toca añadir lastre o pasar a la progresión más difícil.</div>`;
    } else {
      cue.className = "cue done";
      if(hint) hint.innerHTML = `<div class="hint ok">Completo. Sigue sumando reps hasta llegar a ${ex.hi} en todas las series.</div>`;
    }
  }
}

/* ---------- GRÁFICA ---------- */
function drawChart(id){
  const c = document.getElementById("ch-"+id); if(!c) return;
  const h = history(id), ctx = c.getContext("2d");
  const dpr = window.devicePixelRatio || 1, W = c.clientWidth, H = 110;
  c.width = W*dpr; c.height = H*dpr; ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  if(h.length < 2){
    ctx.fillStyle="#3d4453"; ctx.font="12px ui-sans-serif,system-ui"; ctx.textAlign="center";
    ctx.fillText("Registra 2+ sesiones para ver tu progreso", W/2, H/2+4);
    return;
  }
  const vol = h.map(s=> s.sets.reduce((a,x)=> a + (Number(x&&x.w)||0)*(Number(x&&x.r)||0), 0));
  const usable = vol.some(v=>v>0);
  const data = usable ? vol : h.map(s=> s.sets.reduce((a,x)=> a + (Number(x&&x.r)||0), 0));

  const pad=14, mx=Math.max(...data), mn=Math.min(...data), rng=(mx-mn)||1;
  const X = i => pad + i*(W-pad*2)/(data.length-1);
  const Y = v => H-pad - ((v-mn)/rng)*(H-pad*2);

  ctx.strokeStyle="#232936"; ctx.lineWidth=1;
  [0,.5,1].forEach(f=>{ const y=pad+f*(H-pad*2);
    ctx.beginPath(); ctx.moveTo(pad,y); ctx.lineTo(W-pad,y); ctx.stroke(); });

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"rgba(255,138,61,.22)"); g.addColorStop(1,"rgba(255,138,61,0)");
  ctx.beginPath(); ctx.moveTo(X(0),H-pad);
  data.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(data.length-1),H-pad); ctx.closePath(); ctx.fillStyle=g; ctx.fill();

  ctx.beginPath();
  data.forEach((v,i)=> i ? ctx.lineTo(X(i),Y(v)) : ctx.moveTo(X(i),Y(v)));
  ctx.strokeStyle="#ff8a3d"; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();

  data.forEach((v,i)=>{
    ctx.beginPath(); ctx.arc(X(i),Y(v),3,0,7);
    ctx.fillStyle = i===data.length-1 ? "#ff8a3d" : "#12141a";
    ctx.strokeStyle="#ff8a3d"; ctx.lineWidth=1.5; ctx.fill(); ctx.stroke();
  });

  ctx.fillStyle="#5c6478"; ctx.font="10px ui-sans-serif,system-ui"; ctx.textAlign="left";
  ctx.fillText(usable ? "Volumen (kg × reps)" : "Reps totales", pad, 11);
  ctx.textAlign="right";
  const delta = data[data.length-1] - data[0];
  ctx.fillStyle = delta>=0 ? "#4ade80" : "#ff6b6b";
  ctx.fillText((delta>=0?"+":"") + Math.round(delta), W-pad, 11);
}

/* ---------- GUARDAR ---------- */
document.getElementById("savebtn").onclick = ()=>{
  const d = todayISO();
  DB.log[d] = DB.log[d] || {};
  let any = false;
  Object.keys(draft).forEach(id=>{
    const sets = (draft[id].sets||[]).map(s=>({w: s&&s.w ? Number(s.w):0, r: s&&s.r ? Number(s.r):0}));
    if(sets.some(s=>s.r)){ DB.log[d][id] = {sets}; any = true; }
  });
  if(!any && !Object.keys(DB.log[d]).length){ toast("No registraste ninguna serie"); return; }
  persist();
  toast(memoryOnly ? "Aquí no guarda — descarga el archivo" : "Sesión guardada");
  draft = {};
  render();
};

/* ---------- HERRAMIENTAS ---------- */
function toolsHTML(){
  return `
    <div class="tools">
      <button id="exp">Exportar respaldo</button>
      <button id="imp">Importar respaldo</button>
      <button id="rst">Reiniciar ciclo</button>
    </div>
    <input type="file" id="file" accept=".json" hidden>
    <div class="warnbox">
      <b>Ciclo:</b> 9 semanas (2 de reintroducción → 6 de trabajo → 1 de descarga). Al terminar,
      la app pasa sola al bloque B y rota los ejercicios; el bloque siguiente vuelve al A. Los patrones
      de movimiento son los mismos, las variantes cambian.<br><br>
      <b>Tus datos viven solo en este celular</b>, en el navegador. No hay servidor ni cuenta.
      Si borras los datos del navegador, se pierden — exporta un respaldo cada tanto.
      ${memoryOnly ? `<br><br><b style="color:#ff8a3d">Aviso:</b> aquí no hay guardado permanente. Descarga el archivo, ábrelo en Chrome del celular y ahí sí guarda.` : ""}
    </div>`;
}
function bindTools(){
  const exp=document.getElementById("exp"), imp=document.getElementById("imp"),
        rst=document.getElementById("rst"), file=document.getElementById("file");
  if(exp) exp.onclick = ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `bitacora-${todayISO()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast("Respaldo descargado");
  };
  if(imp) imp.onclick = ()=> file.click();
  if(rst) rst.onclick = ()=>{
    if(!confirm("Esto pone la semana 1 (reintroducción) desde hoy. Tu historial de pesos NO se borra. ¿Seguir?")) return;
    DB.start = todayISO(); persist(); render(); toast("Ciclo reiniciado en semana 1");
  };
  if(file) file.onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!d.log) throw 0;
        DB = d; persist(); render(); toast("Respaldo restaurado");
      }catch(_){ toast("Ese archivo no sirve"); }
    };
    r.readAsText(f);
  };
}
function fmt(iso){ const [y,m,d]=iso.split("-"); return `${d}/${m}`; }
let tt;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("show"), 1900);
}

load(); renderNav(); render();
window.addEventListener("resize", ()=>{
  document.querySelectorAll(".ex.open").forEach(e=>drawChart(e.dataset.id));
});
</script>
</body>
