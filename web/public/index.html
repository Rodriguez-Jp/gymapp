<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<title>Bitácora</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230d0f14'/><rect x='20' y='44' width='60' height='12' fill='%23ff8a3d'/></svg>">
<style>
:root{--ink:#0d0f14;--panel:#161a22;--panel-2:#1d222c;--line:#2a3140;--text:#e8eaf0;
--dim:#8790a3;--signal:#ff8a3d;--steel:#5aa9e6;--good:#4ade80;--violet:#a78bfa;--pad:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
font-size:15px;line-height:1.45;padding-bottom:84px;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:rgba(13,15,20,.94);backdrop-filter:blur(12px);
border-bottom:1px solid var(--line);padding:14px var(--pad) 0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{margin:0;font-size:19px;letter-spacing:.07em;font-weight:800;text-transform:uppercase}
.brand h1 span{color:var(--signal)}
.hb{display:flex;align-items:center;gap:8px}
.wk{font-size:11px;color:var(--dim);text-align:right;line-height:1.3}
.wk b{color:var(--text);cursor:pointer}
.wknav{background:none;border:0;color:var(--dim);font:inherit;font-size:15px;font-weight:800;
  padding:0 4px;cursor:pointer;line-height:1}
.wknav:disabled{opacity:.3;cursor:default}
.ubtn{background:var(--panel-2);border:1px solid var(--line);color:var(--dim);font:inherit;
font-size:11px;font-weight:700;padding:6px 9px;border-radius:7px;cursor:pointer}
.ubtn.on{color:var(--signal);border-color:rgba(255,138,61,.4)}
nav{display:flex;gap:3px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:none;border:0;color:var(--dim);font:inherit;font-weight:700;
font-size:12px;letter-spacing:.07em;text-transform:uppercase;padding:10px 11px;cursor:pointer;
border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--signal)}
nav button.rest{color:#5c6478;font-weight:500}
nav button.sum{color:var(--steel)}
main{padding:var(--pad)}
.phase{border-radius:12px;padding:13px 14px;margin-bottom:12px;border:1px solid}
.phase .top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.phase .ttl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.phase .pill{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;background:rgba(255,255,255,.07)}
.phase p{margin:0;font-size:13px;line-height:1.5;color:var(--dim)}
.phase .tech{margin-top:8px;font-size:12px;padding:7px 9px;border-radius:7px;background:rgba(0,0,0,.25);font-weight:600}
.ex-body .tech{margin-top:12px;font-size:12px;padding:8px 10px;border-radius:8px;line-height:1.5;
background:rgba(255,138,61,.09);color:var(--signal);border:1px solid rgba(255,138,61,.22)}
.ex-body .tech b{color:var(--signal)}
.cardio li b{color:var(--signal)}
.p-intro{background:rgba(90,169,230,.08);border-color:rgba(90,169,230,.3)}.p-intro .ttl{color:var(--steel)}
.p-accum{background:rgba(255,138,61,.08);border-color:rgba(255,138,61,.3)}.p-accum .ttl{color:var(--signal)}
.p-intens{background:rgba(167,139,250,.09);border-color:rgba(167,139,250,.32)}.p-intens .ttl{color:var(--violet)}
.p-deload{background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.28)}.p-deload .ttl{color:var(--good)}
.p-maint{background:rgba(74,222,128,.07);border-color:rgba(74,222,128,.28)}.p-maint .ttl{color:var(--good)}
.bar{height:5px;border-radius:4px;display:flex;gap:2px;margin-top:11px}
.bar i{flex:1;background:#2a3140;border-radius:2px}
.bar i.done{background:#3f4a5e}.bar i.now{background:var(--signal)}.bar i.dl{background:var(--good);opacity:.45}
.block{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.block>h3{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
color:var(--dim);font-weight:700;border-bottom:1px solid var(--line);background:var(--panel-2);display:flex;gap:8px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.04em}
.block>h3 .tag{margin-left:auto}
.t-mov{background:rgba(90,169,230,.14);color:var(--steel)}
.t-pow{background:rgba(255,138,61,.14);color:var(--signal)}
.t-fin{background:rgba(74,222,128,.12);color:var(--good)}
.t-fore{background:rgba(167,139,250,.14);color:var(--violet)}
.t-alt{background:rgba(90,169,230,.13);color:var(--steel)}
.block ul{margin:0;padding:12px 14px;list-style:none;color:var(--dim);font-size:14px}
.block ul li{padding:2px 0}
.block ul li::before{content:"·";color:var(--signal);margin-right:8px}
.ex{border-bottom:1px solid var(--line)}.ex:last-child{border-bottom:0}
.ex-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.ex-name{flex:1;min-width:0}
.ex-name .n{font-weight:650;font-size:14.5px;line-height:1.28;overflow-wrap:anywhere}
.ex-name .m{font-size:11.5px;color:var(--dim);margin-top:3px;overflow-wrap:anywhere}
.chev{color:#4a5265;font-size:11px;transition:transform .18s}
.ex.open .chev{transform:rotate(90deg)}
.cue{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:#333a49}
.cue.done{background:var(--good)}
.cue.up{background:var(--signal);box-shadow:0 0 0 3px rgba(255,138,61,.16)}
.ex-body{display:none;padding:0 14px 14px}
.ex.open .ex-body{display:block}
select.var{width:100%;background:#10131a;border:1px solid var(--line);color:var(--text);
border-radius:8px;padding:10px;font:inherit;font-size:13.5px;margin-bottom:10px}
select.var:focus{outline:none;border-color:var(--steel)}
.setrow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.setrow .lbl{width:24px;flex:0 0 24px;font-size:11px;color:#5c6478;font-weight:700;text-align:center}
.setrow .lbl.last{color:var(--signal)}
.setrow input{flex:1;min-width:0;background:#10131a;border:1px solid var(--line);color:var(--text);
border-radius:8px;padding:10px 6px;font:inherit;font-size:15px;text-align:center;font-variant-numeric:tabular-nums}
.setrow input:focus{outline:none;border-color:var(--steel)}
.setrow input::placeholder{color:#3d4453}
.setrow .x{color:#4a5265;font-size:12px}
.setrow .eff{flex:0 0 62px;font-size:10.5px;color:#5c6478;text-align:right;line-height:1.2;font-variant-numeric:tabular-nums}
.prev{font-size:11.5px;color:#5c6478;margin:2px 0 10px 0}
.prev b{color:var(--steel);font-weight:600}
.hint{font-size:12px;padding:8px 10px;border-radius:8px;margin-top:2px;
background:rgba(255,138,61,.09);color:var(--signal);border:1px solid rgba(255,138,61,.22)}
.hint.ok{background:rgba(74,222,128,.08);color:var(--good);border-color:rgba(74,222,128,.2)}
.hint.est{background:rgba(90,169,230,.08);color:var(--steel);border-color:rgba(90,169,230,.22)}
.exbtns{display:flex;gap:8px;margin-top:10px}
.exbtns button{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
font:inherit;font-size:12px;font-weight:650;padding:9px;border-radius:8px;cursor:pointer}
canvas{width:100%;height:118px;display:block;margin-top:12px;border-radius:8px;background:#10131a}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.legend span{font-size:10px;color:#5c6478;display:flex;align-items:center;gap:4px}
.legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.save{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
background:linear-gradient(to top,var(--ink) 62%,rgba(13,15,20,0))}
.save button{width:100%;background:var(--signal);color:#160c04;border:0;border-radius:11px;padding:15px;
font:inherit;font-weight:800;font-size:14px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center}
.stat .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .k{font-size:9.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mn{flex:0 0 88px;font-size:13px;font-weight:600}
.mrow .mb{flex:1;height:8px;background:#10131a;border-radius:4px;overflow:hidden}
.mrow .mb i{display:block;height:100%;background:var(--signal);border-radius:4px}
.mrow .mv{flex:0 0 58px;text-align:right;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.tools button{flex:1;min-width:105px;background:none;border:1px solid var(--line);color:var(--dim);
font:inherit;font-size:12px;padding:11px;border-radius:9px;cursor:pointer}
.warnbox{margin-top:14px;font-size:12px;color:#6b7488;line-height:1.55;border-left:2px solid var(--line);padding-left:12px}
.warnbox b{color:#98a1b3}
.auth{position:fixed;inset:0;z-index:50;background:var(--ink);display:none;align-items:center;justify-content:center;padding:var(--pad)}
.auth.show{display:flex}
.authbox{width:100%;max-width:330px}
.authbox h2{margin:0 0 4px;font-size:26px;letter-spacing:.07em;font-weight:800;text-transform:uppercase;text-align:center}
.authbox h2 span{color:var(--signal)}
.authbox .sub{margin:0 0 22px;font-size:12.5px;color:var(--dim);text-align:center}
.authbox input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
font:inherit;font-size:15px;padding:13px 14px;border-radius:10px;margin-bottom:9px}
.authbox input:focus{outline:0;border-color:var(--signal)}
.authbox button{width:100%;background:var(--signal);color:#160c04;border:0;border-radius:11px;padding:14px;
font:inherit;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;margin-top:5px}
.authbox button.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:600;letter-spacing:.04em}
.authbox button[disabled]{opacity:.5;pointer-events:none}
.autherr{min-height:17px;margin:0 0 8px;font-size:12.5px;color:#ff6b6b;text-align:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--good);
color:#07220f;padding:11px 20px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;
pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Bitá<span>cora</span></h1>
    <div class="hb">
      <div class="wk" id="wk">
        <button class="wknav" id="wkprev" title="Semana anterior">‹</button>
        <b id="wklabel" title="Toca para volver a la semana real"></b>
        <button class="wknav" id="wknext" title="Semana siguiente">›</button>
        <br><span id="today"></span>
      </div>
      <button class="ubtn" id="ubtn">KG</button>
      <button class="ubtn" id="outbtn" style="display:none">Salir</button>
    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<div class="save" id="savebar"><button id="savebtn">Guardar sesión</button></div>
<div class="toast" id="toast"></div>
<div class="auth" id="auth">
  <div class="authbox">
    <h2>Bitá<span>cora</span></h2>
    <p class="sub">Entra para tener tu bitácora en cualquier dispositivo.</p>
    <p class="autherr" id="autherr"></p>
    <input id="au" placeholder="usuario" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    <input id="ap" placeholder="contraseña" type="password" autocomplete="current-password">
    <button id="ain">Entrar</button>
  </div>
</div>
<script>
/* ============ MODELO ============
   slot   = patrón de movimiento (agrupa variantes, suma volumen, comparte progresión)
   variant= ejercicio concreto. type define cómo se interpreta el peso:
     load    -> peso tal cual (barra, máquina, polea)
     perSide -> peso por mancuerna (carga real = 2x)
     bw      -> peso corporal (campo = lastre añadido; carga real = PC + lastre)
     assist  -> máquina asistida (campo = ayuda; carga real = PC - ayuda)
   factor = dificultad relativa dentro del slot (para estimar arranque al cambiar de variante)
============================================ */
const B4=[4,4,4,2,4,4,4,2,4,4,4,2];
const B3=[3,3,3,2,3,3,3,2,3,3,3,2];
const B2=[2,2,2,1,2,2,2,1,2,2,2,1];

const HIBRIDO_A = {
  name:"Tren inferior", sub:"Fuerza (rodilla)",
  warm:["Bici o remo suave, 3 min.","Movilidad de tobillo y cadera (círculos, sentadilla profunda sostenida).","2 series ligeras de sentadilla goblet con poco peso."],
  slots:[
    {id:"hA1", m:"Cuádriceps", setsByWeek:B4, lo:4, hi:6, rest:"3 min", def:[0], v:[
      {id:"back_squat", n:"Sentadilla trasera", t:"load", f:1, note:"Profundidad completa, sin rebote. El ROM completo ES el trabajo de movilidad de cadera y tobillo."},
      {id:"ssb_squat", n:"Sentadilla con barra de seguridad (SSB)", t:"load", f:1, note:"Alternativa si la trasera molesta los hombros/muñecas."},
      {id:"legpress90", n:"Prensa a 90°+", t:"load", f:1.3, note:"Alternativa de menor exigencia técnica."},
    ]},
    {id:"hA2", m:"Isquios", setsByWeek:B3, lo:6, hi:8, rest:"2-3 min", def:[0], v:[
      {id:"rdl", n:"Peso muerto rumano", t:"load", f:1, note:"Descenso 3s, buscar estiramiento máximo de isquios manteniendo columna neutra."},
      {id:"rdl_db", n:"Peso muerto rumano con mancuernas", t:"perSide", f:0.9, note:"Alternativa."},
    ]},
    {id:"hA3", m:"Cuádriceps", setsByWeek:B3, lo:8, hi:10, rest:"2 min", def:[0], v:[
      {id:"bulgara", n:"Sentadilla búlgara", t:"perSide", f:1, note:"Pie trasero elevado 30-40cm. Rango profundo. Trabaja estabilidad + flexor de cadera en estiramiento. Por pierna."},
      {id:"lunge_walk", n:"Zancada caminando con mancuernas", t:"perSide", f:0.9, note:"Alternativa."},
    ]},
    {id:"hA4", m:"Isquios", setsByWeek:B3, lo:10, hi:12, rest:"1-2 min", def:[0], v:[
      {id:"legcurl_seated", n:"Curl femoral sentado", t:"load", f:1, note:"Sentado > tumbado: entrena el isquio en posición alargada."},
      {id:"legcurl_lying", n:"Curl femoral tumbado", t:"load", f:1, note:"Alternativa si no hay máquina sentada."},
    ]},
    {id:"hA5", m:"Gemelo", setsByWeek:B3, lo:12, hi:15, rest:"1 min", def:[0], v:[
      {id:"calf_deficit", n:"Elevación de gemelo en déficit", t:"load", f:1, note:"Pausa 2s abajo en estiramiento. Dorsiflexión de tobillo = requisito de sentadilla profunda."},
      {id:"calf_smith", n:"Elevación de gemelo en máquina o Smith", t:"load", f:1, note:"Alternativa sin déficit si no hay step disponible."},
    ]},
    {id:"hA6", m:"Aductor", setsByWeek:B2, lo:20, hi:30, rest:"45s", def:[0], repLabel:"seg", v:[
      {id:"copenhagen", n:"Plancha Copenhague", t:"bw", f:1, note:"Aductor: la lesión de ingle más común en gente que corre y levanta. Por lado."},
      {id:"copenhagen_bent", n:"Plancha Copenhague con rodilla flexionada", t:"bw", f:0.8, note:"Alternativa más fácil, apoyo en rodilla del pie de arriba."},
    ]},
  ],
  cardio:null,
  cooldown:["90/90 de cadera, 2 min.","Sentadilla profunda sostenida con contrapeso, 1-2 min."],
};

const HIBRIDO_B = {
  name:"Tren superior", sub:"Fuerza + VO2max",
  warm:["Bici o remo suave, 3 min.","Movilidad escapular y de hombro.","2 series ligeras de press banca con la barra vacía."],
  slots:[
    {id:"hB1", m:"Pecho", setsByWeek:B4, lo:4, hi:6, rest:"3 min", def:[0], v:[
      {id:"bench", n:"Press banca con barra", t:"load", f:1, note:"Barra al pecho, sin rebote."},
      {id:"bench_db", n:"Press banca con mancuernas", t:"perSide", f:0.9, note:"Alternativa, más ROM."},
    ]},
    {id:"hB2", m:"Espalda", setsByWeek:B4, lo:4, hi:6, rest:"2-3 min", def:[0], v:[
      {id:"weighted_pullup", n:"Dominadas lastradas", t:"bw", f:1, note:"Extensión completa abajo. Campo = peso añadido."},
      {id:"pulldown_heavy", n:"Jalón al pecho", t:"load", f:1, note:"Si no llegas a 6 dominadas limpias: jalón al pecho 4×6-8."},
    ]},
    {id:"hB3", m:"Hombro", setsByWeek:B3, lo:6, hi:8, rest:"2 min", def:[0], v:[
      {id:"ohp", n:"Press militar de pie", t:"load", f:1, note:"De pie, no sentado. Bloqueo completo overhead = movilidad de hombro y torácica bajo carga."},
      {id:"ohp_db", n:"Press militar de pie con mancuernas", t:"perSide", f:0.85, note:"Alternativa."},
    ]},
    {id:"hB4", m:"Espalda", setsByWeek:B3, lo:6, hi:8, rest:"2 min", def:[0], v:[
      {id:"row_pendlay", n:"Remo con barra (Pendlay o inclinado)", t:"load", f:1, note:"Torso paralelo, sin impulso lumbar."},
      {id:"row_chest_sup", n:"Remo con apoyo en pecho", t:"load", f:1, note:"Alternativa sin exigencia lumbar."},
    ]},
    {id:"hB5", m:"Hombro", setsByWeek:B3, lo:15, hi:20, rest:"1 min", def:[0], v:[
      {id:"facepull", n:"Face pull en polea", t:"load", f:1, note:"Salud de hombro y rotadores externos."},
      {id:"reardelt", n:"Pájaro (rear delt) en polea o mancuernas", t:"load", f:0.9, note:"Alternativa."},
    ]},
  ],
  get cardio(){ return hibridoIntervalCardio(viewWeek()); },
  cooldown:["Vuelta a la calma tras los intervalos, 5 min a ritmo suave."],
};

const HIBRIDO_C = {
  name:"Tren inferior", sub:"Bisagra + resistencia-fuerza",
  warm:["Bici o remo suave, 3 min.","Movilidad de cadera (hip hinge con palo).","2 series ligeras de peso muerto con poco peso."],
  slots:[
    {id:"hC1", m:"Isquios", setsByWeek:B3, lo:3, hi:5, rest:"3-5 min", def:[0], v:[
      {id:"deadlift", n:"Peso muerto convencional", t:"load", f:1, note:"Resetear cada rep."},
      {id:"deadlift_trap", n:"Peso muerto con trap bar", t:"load", f:1, note:"Preferible si tienes cualquier historial lumbar."},
    ]},
    {id:"hC2", m:"Cuádriceps", setsByWeek:B3, lo:8, hi:10, rest:"2 min", def:[0], v:[
      {id:"front_squat", n:"Sentadilla frontal", t:"load", f:1, note:"Torso vertical, profundidad máxima. Exige y construye movilidad de tobillo y torácica."},
      {id:"goblet_squat_c", n:"Sentadilla goblet", t:"load", f:0.6, note:"Alternativa más accesible."},
    ]},
    {id:"hC3", m:"Cuádriceps", setsByWeek:[2,2,2,1,2,2,2,1,2,2,2,1], lo:12, hi:12, rest:"1-2 min", def:[0], v:[
      {id:"lunge_walk_c", n:"Zancada caminando con mancuernas", t:"perSide", f:1, note:"Componente de resistencia-fuerza real. Por pierna."},
      {id:"lunge_static_c", n:"Zancada estática con mancuernas", t:"perSide", f:0.9, note:"Alternativa en espacio reducido."},
    ]},
    {id:"hC4", m:"Glúteo", setsByWeek:B3, lo:10, hi:12, rest:"1-2 min", def:[0], v:[
      {id:"hipthrust", n:"Hip thrust", t:"load", f:1, note:"Pausa 1s arriba."},
      {id:"glutebridge_c", n:"Puente de glúteo", t:"load", f:0.8, note:"Alternativa sin banco."},
    ]},
    {id:"hC5", m:"Agarre", setsByWeek:B3, lo:40, hi:40, rest:"1-2 min", def:[0], repLabel:"m", v:[
      {id:"farmer", n:"Farmer carry", t:"perSide", f:1, note:"Agarre, core, postura escapular. Peso: el máximo que aguantes 40m sin soltar."},
      {id:"suitcase_carry", n:"Suitcase carry (un lado)", t:"load", f:0.7, note:"Alternativa: reto extra de anti-flexión lateral."},
    ]},

   A-B-A la semana 3, B-A-B la semana 4, y así sucesivamente. */
function mariABPattern(w){ return ((w-3)%2===0) ? ["A","B","A"] : ["B","A","B"]; }

function mariDayFor(dayKey){
  const w=viewWeek();
  if(w<=2){
    if(dayKey==="lun") return MARI_A;
    if(dayKey==="jue") return MARI_B;
    if(dayKey==="mar"||dayKey==="vie")
      return mariCardio("25 min",["5 min fácil","15 min moderado","5 min fácil"],
        ["Cinta con inclinación 1-3%.","Bici estática.","Elíptica."]);
    if(dayKey==="mie") return MARI_ACTIVE_REST;
    if(dayKey==="sab")
      return mariCardio("30 min",["5 min fácil","20 min moderado","5 min fácil"],
        ["Caminata rápida al aire libre.","Bici estática.","Nado o baile."]);
    return MARI_REST;
  }
  const pat=mariABPattern(w);
  if(dayKey==="lun") return pat[0]==="A"?MARI_A:MARI_B;
  if(dayKey==="mie") return pat[1]==="A"?MARI_A:MARI_B;
  if(dayKey==="vie") return pat[2]==="A"?MARI_A:MARI_B;
  if(dayKey==="mar"||dayKey==="jue")
    return mariCardio("30 min",["5 min fácil","20 min moderado","5 min fácil"],
      ["Cinta con inclinación 1-3%.","Bici estática.","Elíptica."]);
  if(dayKey==="sab")
    return w<=4
      ? mariCardio("40 min",["5 min fácil","30 min moderado","5 min fácil"],
          ["Caminata rápida al aire libre.","Bici estática.","Nado o baile."])
      : mariCardio("45-60 min",["10 min fácil","30-45 min moderado","10 min fácil"],
          ["Caminata rápida al aire libre.","Bici estática.","Nado o baile."]);
  return MARI_REST;
}
function mariPhaseInfo(w){
  w=Math.max(1,w);
  if(w<=2) return {n:w, phase:"Fase 1", rpe:"-", failure:false,
    note:"Semanas 1-2: base. Lunes y jueves de fuerza (2 series por ejercicio), cardio martes/viernes/sábado, miércoles de descanso activo."};

    DB.start=o.start||todayISO();
    DB.log={};
    for(const date in o.log){
      DB.log[date]={};
      for(const vid in o.log[date]){
        const s=slotOfVariant(vid);
        DB.log[date][s?`${s.id}::${vid}`:vid]=o.log[date][vid];
      }
    }
  }catch(e){}
}
function slotOfVariant(vid){
  for(const d of DAYS){ const p=PROGRAM[d]; if(!p.slots) continue;
    for(const s of p.slots) if(s.v.some(v=>v.id===vid)) return s; }
  return null;
}

/* Arreglo puntual: lo registrado como "row_pend" fue la máquina de placas con pin (stack) */
function fixRowPend(){
  if(DB.fixedRow===2) return;
  for(const d in DB.log){
    const from=["lun_row_h::row_pend","lun_row_h::row_plate"];
    from.forEach(k=>{ if(DB.log[d][k]){ DB.log[d]["lun_row_h::row_stack"]=DB.log[d][k]; delete DB.log[d][k]; } });
  }
  delete DB.mode["lun_row_h::row_plate"];
  DB.mode["lun_row_h::row_stack"]="stack";
  DB.pick["lun_row_h"]="row_stack";
  DB.fixedRow=2;
}
function persist(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){ memoryOnly=true; }
  schedulePush();   // no-op mientras no haya sesión o no se haya hecho el pull inicial
}
/* La sesión en curso (draft) se guarda aparte, sellada con la fecha, para
   sobrevivir a que el navegador mate la pestaña o se refresque a mitad de sesión. */
const DKEY="bitacora_draft";
function persistDraft(){
  /* El draft se sella con la fecha de HOY. Si se está mirando otro día, lo que
     se teclea es una corrección puntual, no la sesión en curso: persistirla
     haría que al recargar reapareciera como si fuera de hoy. Se queda en RAM. */
  if(viewISO()!==todayISO()) return;
  try{ localStorage.setItem(DKEY,JSON.stringify({d:todayISO(),draft})); }catch(e){}
}
function restoreDraft(){
  try{
    const raw=localStorage.getItem(DKEY); if(!raw) return;
    const o=JSON.parse(raw);
    if(o&&o.d===todayISO()&&o.draft) draft=o.draft;   // solo si es de HOY
    else localStorage.removeItem(DKEY);               // de otro día: descartar
  }catch(e){}
}
function clearDraft(){ draft={}; try{ localStorage.removeItem(DKEY); }catch(e){} }

/* ===== NUBE (Worker + D1) =====
   localStorage sigue siendo el buffer inmediato: en el gimnasio no siempre hay
   señal, y la app tiene que funcionar igual. El servidor es la fuente de verdad
   entre dispositivos. Al abrir: pull. Al guardar: push (con reintento si falla).

   Conflictos: last-write-wins por updated_at. Si el updated_at del servidor es
   más reciente que el último push confirmado desde aquí, el servidor gana. No
   hay merge: haría falta un timestamp por serie, y para una bitácora que usa
   una persona en uno o dos dispositivos no compensa la complejidad. */
const API="https://gymapi.jp-home-lab.com";
const TKEY="bitacora_token";        // token de sesión
const UKEY="bitacora_user";         // de quién son los datos que hay en este navegador
const SKEY="bitacora_synced";       // updated_at del último push confirmado
const PKEY="bitacora_pending";      // hay cambios locales sin subir

let token=null, pending=false;
/* Nada se empuja hasta que el primer pull termine. Sin esto, load() siembra
   SEED en un navegador vacío y el push lo mandaría al servidor, pisando el
   historial real antes de que la respuesta del pull llegue siquiera. */
let pushEnabled=false;

const ls={ get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
           set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
           del:k=>{try{localStorage.removeItem(k)}catch(e){}} };

/* Qué rutina se ve depende de quién entró: Jp ve el Híbrido, Mari ve la suya.
   PROGRAM es "let" (no "const") justo por esto — se reapunta al loguearse. */
let CYCLE=HIBRIDO_CYCLE;
function setActiveUser(u){
  activeUser=u;
  PROGRAM = (u&&u.toLowerCase()==="mari") ? MARI_PROGRAM : HIBRIDO_PROGRAM;
}
let activeUser, PROGRAM;
setActiveUser(ls.get(UKEY)||"Jp");

async function api(method,path,body){
  const o={method,headers:{}};
  if(body){ o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(body); }
  if(token) o.headers["Authorization"]="Bearer "+token;
  const r=await fetch(API+path,o);
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error(j.error||("HTTP "+r.status)); err.status=r.status; throw err; }
  return j;
}

const FRESH=()=>({log:{},start:todayISO(),bw:85,unit:"kg",pick:{},mode:{},bars:{std:20,ez:10,smith:15},fixedRow:2});

/* Los datos locales pertenecen a quien entró la última vez. Si entra otro, hay
   que limpiarlos: si no, load() ya los cargó en DB y el primer push los subiría
   a la cuenta equivocada. Si no hay marca de usuario (datos anteriores a que
   existiera el login) se conservan: son de quien está entrando. */
function claimLocal(user){
  const prev=ls.get(UKEY);
  if(prev&&prev!==user){
    [KEY,DKEY,SKEY,PKEY].forEach(ls.del);
    DB=FRESH(); draft={}; pending=false;
  }
  ls.set(UKEY,user);
  setActiveUser(user);
}

let pt;
function schedulePush(){
  if(!API||!token||!pushEnabled) return;
  clearTimeout(pt); pt=setTimeout(push,2000);   // agrupa ráfagas (cambiar variante, modo, etc.)
}

async function push(){
  if(!API||!token||!pushEnabled) return;
  try{
    const r=await api("POST","/save",{data:DB});
    ls.set(SKEY,r.updated_at); ls.del(PKEY); pending=false;
    toast("Guardado en la nube");
  }catch(e){
    if(e.status===401) return logout();
    pending=true; ls.set(PKEY,"1");   // se reintenta al volver la red o al abrir
  }
}

async function sync(){
  try{
    const r=await api("GET","/load");
    if(r.data){
      const mine=ls.get(SKEY);
      if(!mine||r.updated_at>mine){
        DB=Object.assign(FRESH(),r.data);
        ls.set(KEY,JSON.stringify(DB)); ls.set(SKEY,r.updated_at);
        pending=false; ls.del(PKEY);
        renderNav(); render();
      }
      toast("Sincronizado");
    }
    pushEnabled=true;                       // el pull terminó: ya es seguro empujar
    if(!r.data||pending||ls.get(PKEY)) push();   // cuenta nueva, o cambios pendientes
  }catch(e){
    if(e.status===401) return logout();
    /* Sin red: seguimos en local y NO habilitamos el push. Empujar sin haber
       leído antes es justo cómo se pierde el historial. */
    pushEnabled=false;
  }
}

function logout(){
  token=null; pushEnabled=false; ls.del(TKEY);
  showAuth("Tu sesión expiró. Entra otra vez.");
}

/* ===== login / registro ===== */
const $a=id=>document.getElementById(id);
function showAuth(msg){ $a("autherr").textContent=msg||""; $a("auth").classList.add("show"); }
function hideAuth(){ $a("auth").classList.remove("show"); $a("ap").value=""; $a("autherr").textContent=""; }

async function doAuth(path){
  const u=$a("au").value.trim(), p=$a("ap").value;
  if(!u||!p) return showAuth("Faltan usuario o contraseña");
  const btn=$a("ain");
  btn.disabled=true; $a("autherr").textContent="";
  try{
    const r=await api("POST",path,{username:u,password:p});
    token=r.token; ls.set(TKEY,token);
    claimLocal(u);
    hideAuth();
    render();          // el token cambió: refresca la barra de herramientas
    await sync();      // y sync vuelve a pintar si el servidor trae algo más nuevo
  }catch(e){
    showAuth(e.status?e.message:"Sin conexión con el servidor");
  }finally{ btn.disabled=false; }
}

function bindAuth(){
  $a("ain").onclick=()=>doAuth("/login");
  $a("ap").onkeydown=e=>{ if(e.key==="Enter") doAuth("/login"); };
}

async function boot(){
  bindAuth();
  if(!API) return;                  // sin backend configurado: la app sigue siendo 100% local
  if(!token) return showAuth();
  await sync();
}
addEventListener("online",()=>{ if(API&&token){ pushEnabled?push():sync(); } });
function todayISO(){ const d=new Date(); return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function absWeek(){ return Math.max(1,Math.floor((new Date(todayISO())-new Date(DB.start))/(7*864e5))+1); }
/* Navegación de semanas: antes la semana mostrada era SIEMPRE la real (hoy
   vs DB.start), sin forma de ver otra — el usuario la reportó como "bloqueada".
   weekOffset la desplaza; viewWeek() es la semana que se muestra/edita en
   vez de absWeek() en todos lados (fase, series objetivo, y qué fecha cae
   cada día de nav). Solo se resetea manualmente (botón "hoy" o flechas). */
let weekOffset=0;
function viewWeek(){ return Math.max(1, absWeek()+weekOffset); }
/* La rutina de Mari no se repite en un bloque fijo de N semanas como la de
   Jp: crece linealmente (sem1-2, sem3-4, sem5+ para siempre), así que no
   tiene sentido aplicarle el módulo de CYCLE.length. */
function cycleWeek(){ return activeUser&&activeUser.toLowerCase()==="mari" ? viewWeek() : ((viewWeek()-1)%CYCLE.length)+1; }
function blockIdx(){ return activeUser&&activeUser.toLowerCase()==="mari" ? 0 : Math.floor((viewWeek()-1)/CYCLE.length)%2; }
function phase(){ return activeUser&&activeUser.toLowerCase()==="mari" ? mariPhaseInfo(viewWeek()) : CYCLE[cycleWeek()-1]; }
/* Fecha ISO del día de la semana que se está VIENDO, dentro de la semana
   elegida (real + weekOffset). Para hoy con offset 0 = todayISO(); para
   otro día u otra semana = su fecha correspondiente.
   Antes todo se leía de DB.log[todayISO()], así que al mirar un día distinto de hoy
   las series guardadas salían vacías (bug de la sección 5). */
function viewISO(){
  const di=DAYS.indexOf(day); if(di<0) return todayISO();
  const todayIdx=(new Date().getDay()+6)%7;
  return new Date(new Date(todayISO())-(todayIdx-di)*864e5+weekOffset*7*864e5).toISOString().slice(0,10);
}

/* ===== CARGA EFECTIVA — la clave de todo ===== */
const MODES={
  stack:  {n:"Placa / número de la máquina", h:"Metes el número que marca la placa."},
  plate:  {n:"Discos por lado",              h:"Metes el peso de UN lado. La app suma los dos."},
  bar:    {n:"Barra + discos por lado",      h:"Metes el peso de UN lado. La app suma los dos lados + la barra."},
  perSide:{n:"Mancuernas (peso de una)",     h:"Metes el peso de UNA mancuerna. La app dobla la carga."},
};
function modeOf(slot,v){ return DB.mode[key(slot,v.id)] || (v.t==="load"?"stack":v.t); }
function barKg(v){ return DB.bars[v.bar||"std"] || 20; }
/* carga efectiva REAL en kg, según el modo de carga */
function eff(v,w,mode){
  w=Number(w)||0;
  const m = mode || v.t;
  if(m==="bw")      return DB.bw + w;
  if(m==="assist")  return Math.max(0, DB.bw - w);
  if(m==="perSide") return w*2;
  if(m==="plate")   return w*2;
  if(m==="bar")     return w*2 + barKg(v);
  return w;                       // stack / load
}
function effS(slot,v,w){ return eff(v,w,modeOf(slot,v)); }
function fmtW(kg){
  kg=Number(kg)||0;
  const k=Math.round(kg*10)/10, l=Math.round(kg*LB);
  return `${k}kg / ${l}lb`;
}
/* peso que el usuario TECLEA -> kg reales del campo (unidad de la sede) */
function toKg(x){ return DB.unit==="lb" ? (Number(x)||0)/LB : (Number(x)||0); }
function fromKg(kg){ return DB.unit==="lb" ? Math.round(kg*LB*2)/2 : Math.round(kg*2)/2; }

function key(slot,vid){ return slot.id+"::"+vid; }
function chosen(slot){
  const p=DB.pick[slot.id];
  if(p){ const i=slot.v.findIndex(v=>v.id===p); if(i>=0) return slot.v[i]; }
  return slot.v[slot.def[blockIdx()] ?? 0];
}
/* Clamp al último valor definido: el array de Mari (5 semanas) no cubre
   semanas indefinidas — desde la 5 en adelante se queda en el último número. */
function setsOf(slot){
  if(!slot.setsByWeek) return 2;
  const i=Math.min(cycleWeek()-1, slot.setsByWeek.length-1);
  return slot.setsByWeek[i] ?? 2;
}
function hist(slot,vid){
  const k=key(slot,vid), out=[];
  Object.keys(DB.log).sort().forEach(d=>{
    const e=DB.log[d][k];
    if(e&&e.sets&&e.sets.some(s=>s.r)) out.push({date:d,sets:e.sets});
  });
  return out;
}
/* historial de TODO el slot (todas las variantes), para volumen y gráfica unificada */
function histSlot(slot){
  const out=[];
  Object.keys(DB.log).sort().forEach(d=>{
    slot.v.forEach(v=>{
      const e=DB.log[d][key(slot,v.id)];
      if(e&&e.sets&&e.sets.some(s=>s.r))
        out.push({date:d,v:v,sets:e.sets,vol:e.sets.reduce((a,s)=>a+effS(slot,v,s.w)*(Number(s.r)||0),0)});
    });
  });
  return out;
}
function slotById(id){ for(const d of DAYS){const p=PROGRAM[d]; if(!p.slots)continue;
  const s=p.slots.find(x=>x.id===id); if(s) return s;} return null; }

let day=DAYS[(new Date().getDay()+6)%7];
let draft={};
const main=document.getElementById("main"), nav=document.getElementById("nav"), savebar=document.getElementById("savebar");

document.getElementById("ubtn").onclick=()=>{
  DB.unit = DB.unit==="kg" ? "lb" : "kg";

};
function renderU(){ document.getElementById("ubtn").textContent=DB.unit.toUpperCase();
  document.getElementById("ubtn").className="ubtn"+(DB.unit==="lb"?" on":"");

/* Un solo cuenta por dispositivo a la vez: salir es lo único que deja
   cambiar de Jp a Mari (o viceversa) en el mismo celular/computadora. */
async function doLogout(){
  if(pending&&!confirm("Tienes cambios sin subir. Si sales ahora se quedan solo en este dispositivo. ¿Salir igual?")) return;
  try{ await api("POST","/logout"); }catch(e){}   // el token local se va igual
  token=null; pushEnabled=false; ls.del(TKEY);
  render(); showAuth();
}

document.getElementById("wknext").onclick=()=>{ weekOffset++; draft={}; render(); };

    +`<button data-d="sum" class="sum ${day==="sum"?"on":""}">Resumen</button>`;

function phaseHTML(){

  const cw=cycleWeek();

/* ===== RESUMEN: volumen por grupo muscular (suma TODAS las variantes) ===== */
function renderSummary(){
  savebar.style.display="none";
  const wkStart=new Date(new Date(todayISO())-((new Date().getDay()+6)%7)*864e5).toISOString().slice(0,10);
  const mus={}, tot={};
  DAYS.forEach(d=>{ const p=PROGRAM[d]; if(!p.slots)return;
    p.slots.forEach(s=>{ if(s.m==="Potencia")return; tot[s.m]=(tot[s.m]||0)+setsOf(s); }); });
  Object.keys(DB.log).filter(d=>d>=wkStart).forEach(d=>{
    for(const k in DB.log[d]){
      const [sid,vid]=k.split("::"); const s=slotById(sid); if(!s||s.m==="Potencia") continue;
      const v=s.v.find(x=>x.id===vid); if(!v) continue;
      const e=DB.log[d][k], done=e.sets.filter(x=>x.r).length;
      mus[s.m]=mus[s.m]||{sets:0,vol:0};
      mus[s.m].sets+=done;
      mus[s.m].vol+=e.sets.reduce((a,x)=>a+effS(s,v,x.w)*(Number(x.r)||0),0);
    }
  });
  const keys=Object.keys(tot).sort();
  const mx=Math.max(1,...keys.map(m=>tot[m]));
  const volTot=Object.values(mus).reduce((a,x)=>a+x.vol,0);
  main.innerHTML=phaseHTML()+`
  <div class="stats">
    <div class="stat"><div class="v num">${Object.values(mus).reduce((a,x)=>a+x.sets,0)}</div><div class="k">Series esta sem</div></div>
    <div class="stat"><div class="v num">${Math.round(volTot/1000)}k</div><div class="k">Volumen (kg)</div></div>
    <div class="stat"><div class="v num">${Object.keys(DB.log).length}</div><div class="k">Sesiones</div></div>
  </div>
  <div class="block"><h3>Series por músculo — esta semana</h3>
  ${keys.map(m=>{const d=mus[m]||{sets:0,vol:0};
    return `<div class="mrow"><div class="mn">${m}</div>
    <div class="mb"><i style="width:${Math.min(100,d.sets/mx*100)}%"></i></div>
    <div class="mv">${d.sets}/${tot[m]}</div></div>`;}).join("")}
  </div>
  <div class="warnbox">El volumen suma <b>todas las variantes</b> de cada slot: si cambiaste pec deck por
  aperturas con mancuerna, esas series igual cuentan para Pecho. La carga se calcula con la
  <b>carga efectiva</b> (mancuernas ×2, corporal = tu peso, asistida = tu peso − ayuda), no con el número
  suelto de la máquina.</div>`+toolsHTML();
  bindTools();
}

    if(e.target.tagName==="SELECT") return;
    const ex=h.parentElement; ex.classList.toggle("open");
    if(ex.classList.contains("open")) drawChart(ex.dataset.slot);
  });
  eb.querySelectorAll("select.mode").forEach(sel=>sel.onchange=()=>{
    const s=slotById(sel.dataset.slot);
    DB.mode[key(s,chosen(s).id)]=sel.value; persist();
    render();
    const el=document.querySelector(`.ex[data-slot="${sel.dataset.slot}"]`);
    if(el){ el.classList.add("open"); drawChart(sel.dataset.slot); el.scrollIntoView({block:"center"}); }
    toast("Modo de carga: "+MODES[sel.value].n);
  });
  eb.querySelectorAll("select.var:not(.mode)").forEach(sel=>sel.onchange=()=>{
    DB.pick[sel.dataset.slot]=sel.value; persist();
    delete draft[sel.dataset.slot]; persistDraft(); render();
    const el=document.querySelector(`.ex[data-slot="${sel.dataset.slot}"]`);
    if(el){ el.classList.add("open"); drawChart(sel.dataset.slot); el.scrollIntoView({block:"center"}); }
  });
  eb.querySelectorAll("input").forEach(i=>i.oninput=()=>{
    const {slot,idx,f}=i.dataset;
    draft[slot]=draft[slot]||{sets:[]};
    draft[slot].sets[idx]=draft[slot].sets[idx]||{};
    draft[slot].sets[idx][f]=i.value;
    updateRow(slot,idx); updateCue(slot);
    persistDraft();
  });
  eb.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const s=slotById(b.dataset.copy), v=chosen(s), h=hist(s,v.id);
    if(!h.length){ toast("Sin sesiones previas con esta variante"); return; }
    const last=h[h.length-1].sets;
    document.querySelectorAll(`input[data-slot="${s.id}"]`).forEach(inp=>{
      const st=last[inp.dataset.idx]; if(!st) return;
      inp.value = inp.dataset.f==="w" ? fromKg(st.w) : st.r;
      inp.dispatchEvent(new Event("input"));
    });
    toast("Copiado de la última vez");
  });
  p.slots.forEach(s=>{ updateCue(s.id); for(let i=0;i<setsOf(s);i++) updateRow(s.id,i); });
  bindTools();   // faltaba: en día de entreno los botones de herramientas quedaban sin ligar
}

function slotHTML(slot,dayLog){
  const v=chosen(slot), n=setsOf(slot), saved=dayLog[key(slot,v.id)];
  const h=hist(slot,v.id), last=h.length?h[h.length-1]:null;
  const isAlt = v.id !== slot.v[slot.def[blockIdx()]??0].id;

  const prev = last
    ? `Última (${fmt(last.date)}): <b>${last.sets.filter(s=>s.r).map(s=>`${fromKg(s.w)}${DB.unit} × ${s.r}`).join(" · ")}</b>`
    : `Sin registro en esta variante.`;

  const mo=modeOf(slot,v);
  const ph2 = mo==="assist"?"ayuda" : mo==="bw"?"lastre" :
              (mo==="bar"||mo==="plate")?"por lado" : mo==="perSide"?"c/mancuerna" : DB.unit;
  let rows="";
  for(let i=0;i<n;i++){
    const s=(saved&&saved.sets[i])||{};
    rows+=`<div class="setrow">
      <div class="lbl ${i===n-1&&phase().failure?"last":""}">${i+1}</div>
      <input type="number" inputmode="decimal" step="0.5" placeholder="${ph2}"
        data-slot="${slot.id}" data-idx="${i}" data-f="w" value="${s.w!=null?fromKg(s.w):""}">
      <div class="x">×</div>
      <input type="number" inputmode="numeric" placeholder="${slot.repLabel||"reps"}"
        data-slot="${slot.id}" data-idx="${i}" data-f="r" value="${s.r??""}">
      <div class="eff" id="eff-${slot.id}-${i}"></div></div>`;
  }
  const range=slot.lo===slot.hi?slot.lo:`${slot.lo}-${slot.hi}`;
  let tg="";
  if(slot.tag==="pow") tg=` <span class="tag t-pow">potencia</span>`;
  if(slot.tag==="fore") tg=` <span class="tag t-fore">antebrazo</span>`;
  if(isAlt) tg+=` <span class="tag t-alt">alterno</span>`;

  const opts=slot.v.map(x=>`<option value="${x.id}" ${x.id===v.id?"selected":""}>${x.n}</option>`).join("");
  const canMode = !["bw","assist"].includes(v.t);
  const mopts = canMode ? Object.keys(MODES).map(k=>
      `<option value="${k}" ${k===mo?"selected":""}>${MODES[k].n}</option>`).join("") : "";
  /* La técnica de intensidad solo aplica en semanas de fallo: en las de intro
     se entrena con reps en reserva y mostrarla solo invitaría a ignorarla. */
  const t=phase().failure&&slot.tech?TECH[slot.tech]:null;
  const techBox = t ? `<div class="tech"><b>Última serie — ${t.n}.</b> ${t.d}</div>` : "";

  const tHelp = mo==="bw"     ? `Campo = lastre. Carga real = ${DB.bw}kg + lastre.`
              : mo==="assist" ? `Campo = AYUDA de la máquina. Carga real = ${DB.bw}kg − ayuda.`
              : mo==="bar"    ? `${MODES.bar.h} Barra = ${barKg(v)}kg.`
              : MODES[mo] ? MODES[mo].h : "";

  return `<div class="ex" data-slot="${slot.id}">
    <div class="ex-head">
      <div class="cue" id="cue-${slot.id}"></div>
      <div class="ex-name"><div class="n">${v.n}${tg}</div>
        <div class="m num">${n} × ${range} ${slot.repLabel||"reps"} · ${slot.rest} · ${slot.m}</div></div>
      <div class="chev">▶</div>
    </div>
    <div class="ex-body">
      <select class="var" data-slot="${slot.id}">${opts}</select>
      ${canMode?`<select class="var mode" data-slot="${slot.id}">${mopts}</select>`:""}
      <div class="prev">${prev}</div>
      ${rows}
      ${techBox}
      <div id="hint-${slot.id}"></div>
      <div class="exbtns"><button data-copy="${slot.id}">Repetir última</button></div>
      <canvas id="ch-${slot.id}"></canvas>
      <div class="legend" id="lg-${slot.id}"></div>
      <div class="prev" style="margin:10px 0 0">${v.note}${tHelp?` <b style="color:#8790a3">${tHelp}</b>`:""}</div>
    </div></div>`;
}

/* muestra la carga efectiva al lado de cada serie */
function updateRow(sid,i){
  const el=document.getElementById(`eff-${sid}-${i}`); if(!el) return;
  const slot=slotById(sid), v=chosen(slot);
  const d=draft[sid]||(DB.log[viewISO()]||{})[key(slot,v.id)];
  const s=d&&d.sets&&d.sets[i];
  if(!s||(!s.w&&s.w!==0&&s.w!=="0")||!s.r){ el.textContent=""; return; }
  const kg = draft[sid] ? toKg(s.w) : s.w;
  const e=effS(slot,v,kg);
  el.innerHTML = (v.t==="load"&&DB.unit==="kg") ? `${Math.round(e*LB)}lb`
    : `<span style="color:#8790a3">${Math.round(e*10)/10}kg</span><br>real`;
}

function updateCue(sid){
  const slot=slotById(sid), v=chosen(slot), n=setsOf(slot);
  const cue=document.getElementById("cue-"+sid), hint=document.getElementById("hint-"+sid);
  if(!cue) return;
  cue.className="cue"; if(hint) hint.innerHTML="";
  const d=draft[sid]||(DB.log[viewISO()]||{})[key(slot,v.id)];

  /* si NO hay historial en esta variante pero SÍ en otra del slot -> estimar arranque */
  if((!d||!d.sets||!d.sets.some(s=>s&&s.r)) && !hist(slot,v.id).length){
    const others=slot.v.filter(x=>x.id!==v.id).map(x=>({x,h:hist(slot,x.id)})).filter(o=>o.h.length);
    if(others.length&&hint){
      const o=others.sort((a,b)=>b.h.length-a.h.length)[0];
      const lastSets=o.h[o.h.length-1].sets.filter(s=>s.r);
      const bestEff=Math.max(...lastSets.map(s=>effS(slot,o.x,s.w)));
      const targetEff=bestEff*(v.f/o.x.f);
      const mo=modeOf(slot,v);
      let inputKg;
      if(mo==="perSide"||mo==="plate") inputKg=targetEff/2;
      else if(mo==="bar")              inputKg=(targetEff-barKg(v))/2;
      else if(mo==="bw")               inputKg=targetEff-DB.bw;
      else if(mo==="assist")           inputKg=DB.bw-targetEff;
      else                             inputKg=targetEff;
      const lbl=mo==="assist"?"ayuda":mo==="bw"?"lastre":(mo==="bar"||mo==="plate")?"peso POR LADO":mo==="perSide"?"por mancuerna":"peso";
      const val=Math.max(0,Math.round(fromKg(inputKg)*2)/2);
      hint.innerHTML=`<div class="hint est">Estimado desde <b>${o.x.n}</b> (${fmtW(bestEff)} efectivos):
        arranca con <b>${val} ${DB.unit}</b> de ${lbl}. Es una estimación — ajusta en la primera serie.</div>`;
    }
  }
  if(!d||!d.sets) return;
  const filled=d.sets.slice(0,n).filter(s=>s&&s.r).length;
  if(!filled) return;
  if(filled<n) return;

  const allTop=d.sets.slice(0,n).every(s=>s&&Number(s.r)>=slot.hi);
  if(allTop&&slot.hi>slot.lo){
    cue.className="cue up";
    const ws=d.sets.slice(0,n).map(s=>draft[sid]?toKg(s.w):Number(s.w)||0);
    const w=Math.max(...ws);
    const e=effS(slot,v,w);
    const mo=modeOf(slot,v);
    let nw;
    if(mo==="perSide"||mo==="plate"||mo==="bar") nw=w+(e>=80?2.5:1.25);
    else if(mo==="assist")  nw=Math.max(0,w-5);
    else if(mo==="bw")      nw=w+(e>=DB.bw+10?2.5:1.25);
    else                    nw=w+(e>=60?5:e>=20?2.5:1);
    const msg = mo==="assist"
      ? `Llenaste el rango con toda la asistencia. Baja la ayuda a <b>${fromKg(nw)} ${DB.unit}</b> (carga efectiva sube a ${fmtW(effS(slot,v,nw))}).`
      : `Llenaste el rango en todas las series. Sube a <b>${fromKg(nw)} ${DB.unit}</b>${(mo==="bar"||mo==="plate")?" por lado":mo==="perSide"?" por mancuerna":""} y vuelve a ${slot.lo} reps.`;
    if(hint) hint.innerHTML=`<div class="hint">${msg}</div>`;
  } else {
    cue.className="cue done";
    if(hint) hint.innerHTML=`<div class="hint ok">Completo. Sigue sumando reps hasta ${slot.hi} en todas las series.</div>`;
  }
}

/* ===== GRÁFICA DEL SLOT: todas las variantes en una sola línea de progreso ===== */
function drawChart(sid){
  const c=document.getElementById("ch-"+sid); if(!c) return;
  const slot=slotById(sid), h=histSlot(slot), ctx=c.getContext("2d");
  const dpr=devicePixelRatio||1, W=c.clientWidth, H=118;
  c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const lg=document.getElementById("lg-"+sid); if(lg) lg.innerHTML="";
  if(h.length<2){
    ctx.fillStyle="#3d4453"; ctx.font="12px ui-sans-serif,system-ui"; ctx.textAlign="center";
    ctx.fillText("Registra 2+ sesiones para ver tu progreso",W/2,H/2+4);
    return;
  }
  const data=h.map(x=>x.vol), pad=15;
  const mx=Math.max(...data), mn=Math.min(...data), rng=(mx-mn)||1;
  const X=i=>pad+i*(W-pad*2)/(data.length-1);
  const Y=v=>H-pad-((v-mn)/rng)*(H-pad*2-8);
  ctx.strokeStyle="#232936"; ctx.lineWidth=1;
  [0,.5,1].forEach(f=>{const y=pad+8+f*(H-pad*2-8);ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);ctx.stroke();});
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"rgba(255,138,61,.2)"); g.addColorStop(1,"rgba(255,138,61,0)");
  ctx.beginPath(); ctx.moveTo(X(0),H-pad);
  data.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(data.length-1),H-pad); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath();
  data.forEach((v,i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));
  ctx.strokeStyle="#ff8a3d"; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.stroke();
  const used=[];
  h.forEach((pt,i)=>{
    let vi=slot.v.findIndex(x=>x.id===pt.v.id); if(vi<0)vi=0;
    if(!used.includes(vi)) used.push(vi);
    ctx.beginPath(); ctx.arc(X(i),Y(pt.vol),3.5,0,7);
    ctx.fillStyle=VC[vi%VC.length]; ctx.fill();
    ctx.strokeStyle="#0d0f14"; ctx.lineWidth=1.5; ctx.stroke();
  });
  ctx.fillStyle="#5c6478"; ctx.font="10px ui-sans-serif,system-ui"; ctx.textAlign="left";
  ctx.fillText("Volumen efectivo (kg × reps)",pad,10);
  ctx.textAlign="right";
  const dl=data[data.length-1]-data[0];
  ctx.fillStyle=dl>=0?"#4ade80":"#ff6b6b";
  ctx.fillText((dl>=0?"+":"")+Math.round(dl),W-pad,10);
  if(lg) lg.innerHTML=used.map(vi=>`<span><i style="background:${VC[vi%VC.length]}"></i>${slot.v[vi].n}</span>`).join("");
}

document.getElementById("savebtn").onclick=()=>{
  const d=viewISO(); DB.log[d]=DB.log[d]||{};
  let any=false;
  Object.keys(draft).forEach(sid=>{
    const slot=slotById(sid); if(!slot) return;
    const v=chosen(slot);
    const sets=(draft[sid].sets||[]).map(s=>({w:s&&s.w!==undefined&&s.w!==""?toKg(s.w):0,r:s&&s.r?Number(s.r):0}));
    if(sets.some(s=>s.r)){ DB.log[d][key(slot,v.id)]={sets}; any=true; }
  });
  if(!any&&!Object.keys(DB.log[d]).length){ toast("No registraste ninguna serie"); return; }
  persist(); toast(memoryOnly?"Aquí no guarda — descarga el archivo":"Sesión guardada");
  clearDraft(); render();
};

function toolsHTML(){
  return `<div class="tools">
    <button id="bw">Peso corporal</button>
    <button id="bars">Peso de barras</button>
    <button id="exp">Exportar</button>
    <button id="imp">Importar</button>
    <button id="rst">Reiniciar ciclo</button>
    ${API&&token?`<button id="out">Salir (${ls.get(UKEY)||""})</button>`:""}
  </div><input type="file" id="file" accept=".json" hidden>
  <div class="warnbox">
    <b>Unidades:</b> el botón KG/LB de arriba cambia en qué unidad tecleas (para cuando la sede está en libras).
    Todo se guarda en kg y verás la equivalencia al lado de cada serie.<br><br>
    <b>Variantes:</b> el desplegable de cada ejercicio te deja cambiar a máquina, mancuernas o polea si está
    ocupado. Cada variante guarda su propio historial, pero el <b>volumen y la gráfica del slot se suman igual</b>.
    Al estrenar una variante te estimo el peso de arranque desde otra que ya hayas hecho.<br><br>
    <b>Modo de carga:</b> el segundo desplegable de cada ejercicio define cómo cuenta el peso que tecleas:
    número de la placa, discos por lado (×2), barra + discos por lado (×2 + barra), o mancuerna (×2).
    Elígelo una vez por ejercicio y la app lo recuerda. Así puedes seguir anotando el peso de un lado
    sin hacer cuentas, y el volumen sale correcto.<br><br>
    <b>Dominadas:</b> asistida y lastrada están en la misma escala real (peso corporal ± ayuda/lastre),
    así que tu progresión es una sola línea continua.<br><br>
    ${API?`<b>Sincronización:</b> tus datos se guardan en la nube y en este dispositivo. Al abrir la app se bajan,
    al guardar una sesión se suben. Sin señal sigues entrenando igual: queda en local y sube cuando vuelva la red.
    El respaldo manual sigue ahí por si acaso.`:`Tus datos viven <b>solo en este celular</b>. Exporta respaldo cada tanto.`}
    ${memoryOnly?`<br><br><b style="color:#ff8a3d">Aviso:</b> aquí no hay guardado permanente. Descarga el archivo y ábrelo en Chrome.`:""}
  </div>`;
}
function bindTools(){
  const $=id=>document.getElementById(id);
  if($("bw")) $("bw").onclick=()=>{
    const x=prompt("Tu peso corporal en kg (para calcular dominadas y ejercicios de peso corporal):",DB.bw);
    if(x&&!isNaN(x)&&Number(x)>25){ DB.bw=Math.round(Number(x)*10)/10; persist(); render(); toast("Peso corporal: "+DB.bw+" kg"); }
  };
  if($("bars")) $("bars").onclick=()=>{
    const s=prompt("Peso de la barra olímpica vacía, en kg (la estándar pesa 20):",DB.bars.std);
    if(s&&!isNaN(s)) DB.bars.std=Number(s);
    const e=prompt("Peso de la barra EZ vacía, en kg (suele ser 10):",DB.bars.ez);
    if(e&&!isNaN(e)) DB.bars.ez=Number(e);
    const m=prompt("Peso de la barra del Smith, en kg (varía mucho: 7-25; si no sabes, deja 15):",DB.bars.smith);
    if(m&&!isNaN(m)) DB.bars.smith=Number(m);
    persist(); render(); toast("Barras actualizadas");
  };
  if($("exp")) $("exp").onclick=()=>{
    const b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download=`bitacora-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
    toast("Respaldo descargado");
  };
  if($("imp")) $("imp").onclick=()=>$("file").click();
  if($("rst")) $("rst").onclick=()=>{
    if(!confirm("Pone la semana 1 (reintroducción) desde hoy. Tu historial NO se borra. ¿Seguir?")) return;
    DB.start=todayISO(); persist(); render(); toast("Ciclo reiniciado");
  };
  if($("out")) $("out").onclick=doLogout;
  if($("file")) $("file").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
      const o=JSON.parse(r.result); if(!o.log) throw 0;
      /* acepta respaldos viejos (claves sin slot) y los migra */
      const nl={};
      for(const date in o.log){ nl[date]={};
        for(const k in o.log[date]){
          if(k.includes("::")){ nl[date][k]=o.log[date][k]; continue; }
          const s=slotOfVariant(k);
          nl[date][s?`${s.id}::${k}`:k]=o.log[date][k];
        } }
      DB.log=nl; DB.start=o.start||DB.start;
      if(o.bw) DB.bw=o.bw; if(o.unit) DB.unit=o.unit;
      if(o.pick) DB.pick=o.pick; if(o.mode) DB.mode=o.mode; if(o.bars) DB.bars=o.bars;
      DB.fixedRow=o.fixedRow||0;
      fixRowPend();                       // remapea row_pend -> row_stack si viene de un respaldo viejo
      persist(); render();
      const n=Object.keys(DB.log).length;
      toast(`Restaurado: ${n} ${n===1?"sesión":"sesiones"}`);
    }catch(_){ toast("Ese archivo no sirve"); } };
    r.readAsText(f);
  };
}
function fmt(iso){const[y,m,d]=iso.split("-");return `${d}/${m}`;}
let tt; function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");
clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),1900);}
addEventListener("resize",()=>document.querySelectorAll(".ex.open").forEach(e=>drawChart(e.dataset.slot)));

/* El token se lee antes del primer render: la barra de herramientas muestra
   "Salir" solo si hay sesión, y boot() es async — llegaría tarde. */
if(API){ token=ls.get(TKEY); pending=!!ls.get(PKEY); }
load(); restoreDraft(); renderNav(); render(); boot();
if(seeded) setTimeout(()=>toast("Cargada tu sesión del 13/07"),400);
if(Object.keys(draft).length) setTimeout(()=>toast("Recuperé tu sesión en curso"),400);
</script>
